[package]
name = "solidcraft-plugin-guest"
description = "Write a SolidCraft plugin once against solidcraft_plugin::Plugin and export it as a WebAssembly component (the solidcraft:plugin world) with one macro"
version.workspace = true
edition.workspace = true
license.workspace = true

# The workspace lints, except unsafe_code: denied, not forbidden. A component's exports are
# `extern "C"` functions with exported names, which Rust spells as unsafe attributes; the code
# wit-bindgen generates for them (here and in `export_plugin!`) allows it. Keep the rest in sync
# with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
solidcraft-plugin = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }

# Test plugins for the WebAssembly host (crates/plugin-wasm/tests), each one component.
[[example]]
name = "slab"
path = "examples/slab/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "spin"
path = "examples/spin/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "hog"
path = "examples/hog/lib.rs"
crate-type = ["cdylib"]
