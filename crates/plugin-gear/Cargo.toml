[package]
name = "solidcraft-plugin-gear"
description = "A gear studio plugin for SolidCraft: involute spur and helical gears, external or ring, placed in mesh with each other; compiled into an app or loaded as a WebAssembly plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

# The workspace lints, except unsafe_code: denied, not forbidden, so that the example (the plugin
# as a WebAssembly component) can take export_plugin!'s export glue, which allows it. Keep the rest
# in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
solidcraft-plugin = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
solidcraft-engine = { workspace = true }
solidcraft-kernel = { workspace = true }
# The plugin as a WebAssembly component (examples/gear), loaded by the host in tests/wasm.rs.
solidcraft-plugin-guest = { workspace = true }
solidcraft-plugin-wasm = { workspace = true }
wit-component = { workspace = true }

# The plugin as a WebAssembly component: `cargo xtask plugin solidcraft-plugin-gear gear`.
[[example]]
name = "gear"
path = "examples/gear/lib.rs"
crate-type = ["cdylib"]
