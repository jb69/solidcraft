[package]
name = "solidcraft-plugin-wasm"
description = "SolidCraft's WebAssembly plugin host: loads components of the solidcraft:plugin world from plugin folders, runs them with fuel and memory limits, and registers them as plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true }

[dev-dependencies]
solidcraft-engine = { workspace = true }
solidcraft-kernel = { workspace = true }
wit-component = { workspace = true }
